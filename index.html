<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades Documentales 2026 | SGC-VAF</title>
<style>
:root{--violet:#452080;--violet-dark:#351568;--violet-mid:#5b2aa0;--aqua:#45d5d0;--pink:#ef4b87;--ink:#27233d;--muted:#747088;--bg:#f4f1f9;--border:#e4dfed}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.hero{height:340px;background:linear-gradient(112deg,#32145f 0%,#452080 55%,#6732bd 100%);position:relative;overflow:hidden;box-shadow:0 5px 18px rgba(48,25,83,.22)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,.35),rgba(255,255,255,.9));opacity:.65}
.hero-inner{max-width:1220px;margin:auto;height:100%;padding:78px 24px 38px;position:relative;z-index:2}
.kicker{display:flex;align-items:center;gap:10px;color:var(--aqua);font-size:12px;font-weight:800;letter-spacing:1.9px}
.kicker:before{content:"";width:22px;height:3px;background:var(--aqua);display:block;border-radius:2px}
h1{color:#fff;font-size:54px;line-height:1.04;margin:20px 0 18px;letter-spacing:-1.5px;font-weight:800}.subtitle{color:#eeeaf7;font-size:16px;margin:0}
.mascot{position:absolute;right:42px;bottom:10px;height:318px;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 8px 7px rgba(25,10,45,.14))}
.filters-wrap{background:#fff;border-bottom:1px solid #ded9e8}.filters{max-width:1220px;margin:auto;padding:17px 24px;display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:14px}.filter-label{font-size:11px;font-weight:850;letter-spacing:1.4px;color:#67627b;text-transform:uppercase;white-space:nowrap}
select{appearance:none;border:1px solid #ddd8e9;border-radius:24px;background:#f7f5fa;color:#39334f;padding:12px 48px 12px 18px;min-width:270px;font-size:14px;font-weight:700;outline:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#4d2688 50%),linear-gradient(135deg,#4d2688 50%,transparent 50%);background-position:calc(100% - 21px) 17px,calc(100% - 15px) 17px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;transition:.2s ease}
select:focus{border-color:#a98bce;box-shadow:0 0 0 3px rgba(91,42,160,.08)}.counter{margin-left:auto;font-size:13px;color:#716c83;font-weight:700}
main{max-width:1220px;margin:auto;padding:34px 24px 62px}h2{font-size:22px;margin:0 0 22px;color:#31215e;letter-spacing:.1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 5px 16px rgba(59,38,91,.07);min-width:0}
.card-top{height:46px;background:linear-gradient(90deg,var(--violet),var(--violet-mid));display:flex;align-items:center;padding:0 19px;color:#fff;gap:12px}.process{color:var(--aqua);font-size:11px;letter-spacing:1.25px;font-weight:850;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{margin-left:auto;background:var(--pink);padding:5px 11px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap}.card-body{padding:17px 20px 20px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.badge{background:#f5f2fa;border:1px solid #e5e0ee;border-radius:14px;padding:5px 10px;font-size:12px;color:#564d70;font-weight:750}
.doc-title{font-size:17px;line-height:1.3;margin:6px 0 17px;font-weight:800;color:#29243f}.change-label{border-bottom:2px solid var(--aqua);padding-bottom:7px;margin-bottom:12px;color:#bd3f70;font-size:11px;font-weight:900;letter-spacing:1.45px}
.change-text{font-size:13.5px;line-height:1.55;color:#4b465c;white-space:pre-line;margin:0;max-height:175px;overflow:auto;padding-right:5px}.change-text::-webkit-scrollbar{width:5px}.change-text::-webkit-scrollbar-thumb{background:#d8d1e3;border-radius:8px}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;background:#fff;border:1px dashed #cfc7dd;border-radius:14px;color:#777188}
@media(max-width:760px){.hero{height:295px}.hero-inner{padding-top:52px}h1{font-size:41px}.mascot{height:245px;right:8px;bottom:8px;opacity:1}.filters{gap:12px}.filter-group{width:100%;justify-content:space-between}select{min-width:0;width:70%}.counter{width:100%;margin:3px 0 0}.grid{grid-template-columns:1fr}}
</style></head>

imina verificar el funcionamiento seguro, eficiente de los equipos, infraestructura física, herramientas y elementos.\n\nActividades de cambio se incluye el párrafo son aquellas acciones que implican reemplazar, modificar o renovar elementos que ya cumplieron su vida útil, presentan daño o requieren actualización para garantizar el adecuado funcionamiento de la infraestructura o los equipos y se elimina la sustitución de un equipo, herramienta o elemento que haya cumplido su ciclo de vida útil.\n\n6.2.4 Equipos y elementos de logística se incluye El personal del subproceso de Logística es el encargado de realizar los mantenimientos preventivos a los equipos y/o herramientas utilizados en las labores de jardinería, así como los videobeam y equipos de sonido. Se elimina el párrafo Cuando se requiera un mantenimiento correctivo el equipo o herramienta será son enviados a mantenimiento con proveedores externos. de acuerdo al cronograma de mantenimiento preventivo establecido, realizando el trámite administrativo; el responsable de esta actividad es el subproceso de Logística.\nSe incluye el párrafo Cuando se determine que un equipo presenta fallas en su funcionamiento que no puedan ser solucionadas por el personal, será remitido a un proveedor externo para la realización del diagnóstico, cotización y gestión de aprobación del servicio, con el fin de ejecutar el mantenimiento correctivo correspondiente.\n\nEn el punto 7 control y seguimiento del mantenimiento se incluye de acuerdo con lo establecido en la Guía Inspecciones de seguridad y salud en el trabajo TAH-GU-001-UDES y se elimina fundamentado en el cronograma de mantenimiento establecido por cada área.\nSe elimina el formato hoja de vida y control de mantenimiento de herramientas código SST-FT-012-UDES.\n\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Julio", "id": "5407", "codigo": "EDC-FT-002-UDES", "version": "11", "nombre": "PROPUES el texto se organizó en una tabla donde se modificaron las descripciones de cada variable, para mejorar su comprensión.\n\n5.3.\nEn el primer párrafo se cambió la palabra \"calificándolos\" por \"evaluándolos\" y al final de dicho párrafo se adicionó \"si aplica\".\n\nSe cambian las figuras que relacionan los criterios de probabilidad e impacto, para mejorar la visualización de la información contenida en las mismas.\n\nEn el segundo párrafo, el texto se eliminó y se reemplazó por la tabla adjunta (frecuencia - factibilidad).\n\n5.5.1.\nSe creó este numeral (título) para separar los temas tratados en este apartado. Aquí el texto relacionado con los planes de acción y oportunidades cerradas eficazmente se convirtió en tabla.\n\n5.7.\nSe adicionó al final del párrafo: \"de acuerdo con lo definido en la tabla 5 del numeral en el procedimiento VAF-PR-003-UDES Procedimiento de Acciones Correctivas, Preventivas y de Mejora.\"\n\nSe ajusta el control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5510", "codigo": "VAF-MN-001-UDES", "version": "29", "nombre": "MANUAL DE CALIDAD SGC-VAF", "tipo": "Manuales", "proceso": "SGC VAF", "fecha": "18/08/2026", "cambios": "Numeral 8.1.1.1\nEn la viñeta asociada a \"Análisis del contexto externo\" se relacionaron los nombres completos a los que se refieren las siglas: CESU (Consejo Nacional de Educación Superior) y CNA (Consejo Nacional de Acreditación).\n\nNumeral 8.3.\n• Se eliminó la expresión \"de la Vicerrectoría Administrativa y Financiera, Registro y Control Académico y Gestión Documental y de esta forma evidenciar\" y se cambió por \"que hacen parte del alcance de Sistema, reflejando...\".\n• Asimismo, se eliminó la oración \"Para los procesos de Biblioteca y Gestión de Comunicaciones y subproceso de Laboratorios, aplican los ejes generales definidos para la planeación del sistema\". Se eliminó la frase \"Para esto deben informar\" y se reemplazó por \"Informando previamente\".\n• En los ejes definidos para el SGC-VAF se incluyó \"Gestión del cambio (La gestión del cambio asegura que las modificaciones internas o externas sean planificadas, evaluadas, comunicadas e implementadas de manera controlada, considerando sus impactos, riesgos, recursos y responsables, y realizando seguimiento a su eficacia)\".\n\nNumeral 8.3.1.\nEn el párrafo que inicia con \"Corresponde a los líderes nacionales de procesos y/o subprocesos del SGC-VAF la actualización de los registros correspondientes, en las respectivas matrices...\" se adicionó: \"en las respectivas matrices\", \"u oportunidades\" y \"y/o cambie la evaluación de los riesgos y oportunidades.\n\nSe reorganizó la información relacionada con el cierre eficaz de planes de acción y se organizó en una tabla, así como se incluyó la columna relacionada con \"Oportunidades cerradas de manera eficaz\".\n\nNumeral 8.3.3.\nPrevio al último párrafo se incluyó: \"Así mismo, los cambios gestionados deberán incorporarse en la planeación estratégica de la vigencia mediante las actividades y subactividades necesarias para su implementación, seguimiento y control, registrándolas en el eje estratégico Gestión del Cambio, definiendo los responsables, recursos, plazos de ejecución y mecanismos de seguimiento correspondientes. El responsable deberá igualmente aplicar el procedimiento de Gestión del Riesgo VAF-PR-007-UDES, en su apartado sobre evaluación del riesgo, con el fin de identificar y tratar los riesgos y oportunidades asociados al cambio\".\n\nNumeral 8.4.1.5.\nSe agregó el último párrafo que expresa: \"Como complemento a la gestión del conocimiento, el SGC-VAF integra el procedimiento de la Gestión del Cambio VAF-PR-006-UDES como un mecanismo para asegurar que el conocimiento organizacional se preserve, actualice y transfiera durante la implementación de cambios derivados de factores internos o externos que puedan impactar la prestación de los servicios. En este sentido, previo a la implementación de un cambio se evalúan sus efectos sobre los procesos, los riesgos y oportunidades, la información documentada, las competencias del personal y las necesidades de comunicación con las partes interesadas\".\n\nNumeral 9.1.1.\n\nSe adicionó la siguiente información: \"El registro de la planeación anual se debe realizar por cada proceso /subproceso de acuerdo al campus que aplique. En el caso de los procesos y subprocesos nacionales en el campo “Nombre” se debe colocar UDES y el año lectivo; por ejemplo, UDES 2026; considerando que la planeación se ejecuta desde un único campus, pero las actividades deben permear a todos los campus\" y se adicionó la figura 15.\n\nEn la tabla 4 se ajustó el nombre a \"Ejes estratégicos para la planeación de los procesos y subprocesos que hacen parte del SGC-VAF\".\n\nSe coloca negrilla a las viñetas para facilitar la identificación de los ejes estratégicos\n\nNumeral 10.1.1.3.\nEn la figura 21 se cambió la ubicación de la descripción de la pirámide de satisfacción general, hacia la derecha.\n\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5511", "codigo": "VAF-GU-002-UDES", "version": "4", "nombre": "GUÍA PARA EL REGISTRO DE LA PLANEACIÓN ANUAL DE LOS PROCESOS Y SUBPROCESOS DEL SGC-VAF", "tipo": "Guía", "proceso": "SGC VAF", "fecha": "18/08/2026", "cambios": "Numeral 3.2\nEn el literal 3 se elimina la frase inicial \"registrar la información correspondiente, así \" y se reemplaza por: \"el registro de la planeación anual se debe realizar por cada proceso/subproceso de acuerdo al campus que aplique así\" y al final del párrafo se incluyó: \"En el caso de los procesos y subprocesos nacionales en el campo “Nombre” se debe colocar UDES y el año lectivo; por ejemplo, UDES 2026; considerando que la planeación se ejecuta desde un único campus, pero las actividades deben permear a todos los campus\" y se adicionó la figura siguiente donde se encierra en rojo el campo \"Nombre\".\n\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5487", "codigo": "TAH-PG-003-UDES", "version": "14", "nombre": "PROGRAMA DE CAPACITACIÓN", "tipo": "Programas", "proceso": "Talento Humano", "fecha": "18/08/2026", "cambios": "Numeral 3, se incluye descripción de la responsabilidad de Talento Humano respecto al Programa de Capacitación; también se mencionan como responsables a los líderes de procesos y/o subprocesos académicos, administrativos y los trabajadores, con la descripción de sus responsabilidades frente al programa.\n\nNumeral 5.2.1 se amplía información respecto a las competencias transversales y conocimientos institucionales. Se actualiza la lista de información institucional que deben conocer los trabajadores. En cuanto al Marco Estratégico se eliminan componentes, se incluye el concepto. Se reemplaza Organigrama por Estructura Organizacional para incluir la información que corresponde a este aspecto.\n\nNumeral 5.2.2. Se actualiza información relacionada con la versión actual del formato Cronograma de Capacitación TAH-FT-020-UDES, respecto a la inclusión de campos para registro de: Fuentes de Identificación; competencia; número de grupos (se indica aplicación). En la sección Ejecución para registro de la información relacionada con el desarrollo de la actividad, se incluyen campos de Participantes y Modalidad, se reubica Cobertura. Se incluye información de las modificaciones realizadas. También se incluye espacio para la firma de quien aprueba y fecha de la aprobación del Cronograma de Capacitación.\n\nNumeral 5.5. Evaluación del Programa de Capacitación, se incluye referencia del Procedimiento Capacitación y Formación TAH-PR-008-UDES, para correlacionar actividades de seguimiento, medición y análisis definidos en el procedimiento como parte integral de la evaluación del programa.\n\nNumeral 5.6. Compromisos y Responsabilidades: se incluyen responsabilidades a los trabajadores relacionadas con la obligatoriedad de realizar la Inducción (iniciando la vinculación laboral) y Reinducción (cada dos años), así como el Plan de Entrenamiento, que aplica al ingreso o traslado, compuesto por formación autónoma; actividades formativas con apoyo de procesos académicos, administrativos y Talento Humano.\n\nNumeral 6. Definiciones: Capacitación, se incluyen principales objetivos de las actividades de capacitación.\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5489", "codigo": "DIF-GU-002-UDES", "version": "15", "nombre": "GUÍA PARA EL MANEJO DE VIÁTICOS", "tipo": "Guía", "proceso": "Gestión Financiera", "fecha": "14/08/2026", "cambios": "Se modifica el rubro de hospedaje para la ciudad de Valledupar.\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5492", "codigo": "VAF-PG-004-UDES", "version": "7", "nombre": "PROGRAMA GESTIóN DEL CONOCIMIENTO", "tipo": "Programas", "proceso": "SGC VAF", "fecha": "14/08/2026", "cambios": "Se ajusta el responsable de la actualización y divulgación de este programa.\n\nSe cambia Figura Modelo SECI.\n\nSe elimina descripciones de las ilustraciones del presente programa.\n\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5477", "codigo": "VAF-FT-036-UDES", "version": "1", "nombre": "INFORME DE EJECUCIÓN GASTOS DE VIAJE DE CONVOCATORIA INTERNA Y EXTERNA", "tipo": "Formatos", "proceso": "SGC VAF", "fecha": "14/08/2026", "cambios": "Se incluye la identificación del campus al cual pertenece el proyecto. Se incluye el apartado de datos del proyecto identificando el número del proyecto y el número de la convocatoria proyecto."}, {"mes": "Agosto", "id": "5468", "codigo": "GED-GU-004-UDES", "version": "10", "nombre": "GUÍA DE DOCUMENTOS ACADÉMICO ADMINISTRATIVOS", "tipo": "Instructivo", "proceso": "Gestión Documental", "fecha": "13/08/2026", "cambios": "Se reemplaza la palabra “funcionario por Colaborador”. Se anexa “ Informe “ y se elimina el texto “.\n\nSe cambia imagen del contenido del Acuerdo. Se cambia imagen del contenido de la Resolución.\n\nSe cambia imagen del contenido de la Directiva. Se cambia imagen del acta.\n\nSé modifican los nombres de personal UDES utilizados para ejemplos en el contenido del documento\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5469", "codigo": "EDC-FT-001-UDES", "version": "10", "nombre": "PROPUESTA ACADÉMICA", "tipo": "Formatos", "proceso": "Educación Continua", "fecha": "11/08/2026", "cambios": "Se ajusta número de caracteres en el Titulo del Evento Se incluye una fila en el ítem 8 Se ajustan algunos textos Se ajusta color en la tabla responsable del evento Se ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5474", "codigo": "GED-GU-003-UDES", "version": "11", "nombre": "GUÍA ORGANIZACIÓN DE ARCHIVOS DE GESTIÓN Y TRANSFERENCIAS DOCUMENTALES", "tipo": "Instructivo", "proceso": "Gestión Documental", "fecha": "11/08/2026", "cambios": "Se cambia la imagen del ejemplo de Formato de referencia cruzada y se anexa el código del formato GEF-FT-011-UDES\n\nSe cambia la imagen del Ejemplo del diligenciamiento del formato Rótulo de Gavetas GED-FT-019-UDES\n\nCambiar la imagen del ejemplo del formato de Inventario Único Documental GED-FT-005-UDES\n\nCambiar la imagen del ejemplo del formato de control préstamo de documentos archivos de gestión GED-FT-007-UDES\n\nSe elimina el Acuerdo ACUERDO 007 DE 2014 y se reemplaza por el Acuerdo 01/2024 del Archivo General de la Nación.\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5473", "codigo": "GED-GU-005-UDES", "version": "15", "nombre": "GUÍA DE CORRESPONDENCIA Y COMUNICACIONES", "tipo": "Guía", "proceso": "Gestión Documental", "fecha": "11/08/2026", "cambios": "En DOCUMENTOS DE REFERENCIA, se anexa el acuerdo 001/2024 AGN y se elimina el acuerdo no. 060 del 30 de octubre de 2001.\n\nSe reemplaza, el presente Instructivo, por la presente guía\n\nSe reemplaza, Instructivo GED-IN-004-UDES, por guía GED-GU-004-UDES\n\nSe ajusta la tabla códigos alfabéticos; Se corrigen nombres, se eliminan los que ya no existen y se anexan nuevos.\n\nSe modifica el código de la nota interna para Bucaramanga y se anexa\nGED-FT-003-VAL, GED-FT-003-CUC y se cambia la imagen,\n\nSe modifica el código de la circular interna para Bucaramanga y se anexa\nGED-FT-002-VAL, GED-FT-002-CUC y se cambia la imagen\n\nSe cambia la imagen del Sello fechador que se utiliza en guías y planillas de las comunicaciones externas recibidas por mensajería\n\nSe modifica el nombre del instructivo GED-IN-002-UDES por la guía GED-GU-003-UDES Organización de Archivos de Gestión y Transferencias Documentales\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5456", "codigo": "COM-RG-001-UDES", "version": "0", "nombre": "REGLAMENTO REDES SOCIALES", "tipo": "Reglamento", "proceso": "Gestión de Comunicaciones", "fecha": "04/08/2026", "cambios": "Versión de prueba"}, {"mes": "Agosto", "id": "5464", "codigo": "VAF-PI-001-UDES", "version": "20", "nombre": "POLÍTICAS INSTITUCIONALES DE LOS PROCESOS Y SUBPROCESOS DEL SGC-VAF", "tipo": "Políticas Institucionales", "proceso": "SGC VAF", "fecha": "04/08/2026", "cambios": "Se elimina del gráfico de estructura de la Vicerrectoría Administrativa y Financiera a “Medios Educativos”.\n\nSe incluyen los siguientes lineamientos en el numeral Atención Al estudiante:\n\n• Para aquellos programas académicos que en su plan de estudios el semestre lo compone un solo curso, se debe pagar el semestre completo y no tiene derecho al tipo de descuento LIQUIDACIÓN POR MATRICULAR UNICO CURSO O SOLO PROYECTO DE GRADO.\n\n• Los estudiantes a quienes se les otorgue descuento por único curso y matriculen más de un curso (sin tener en cuenta los cursos de formación complementaria y mejoramiento académico) perderán automáticamente el beneficio, por lo cual deberán cancelar el excedente generado y reportar al subproceso de Crédito y Cartera, de lo contrario registrarán pendiente de paz y salvo con este subproceso.\n\n• Los estudiantes que radiquen en el aplicativo de devoluciones y congelaciones una solicitud por concepto de: “Congelar porcentaje del valor pagado de matrícula”, por concepto de enfermedad, los estudiantes deberán diligenciar el formato de “Autorización para revisión de historia clínica y tratamiento de datos sensibles”.\n\n• Los estudiantes que radiquen en el aplicativo de devoluciones y congelaciones una solicitud por concepto de: “Devolución de un porcentaje del valor pagado de matrícula”, por concepto de enfermedad terminal debidamente certificada, los estudiantes deberán diligenciar el formato de “Autorización para revisión de historia clínica y tratamiento de datos sensibles.”\n\n• Se incluye lineamiento “Para los estudiantes de programas académicos que se encuentren en prácticas o adelanten consultorio jurídico deberán radicar la solicitud de descuento en el periodo determinado por la universidad en el calendario académico. El programa debe emitir correo con el respectivo listado para la validación del beneficio solicitado.”\n\n• Se complementa el literal m, al final, con el siguiente enunciado “según el Acuerdo No.005 “Por el cual se modifica el Acuerdo No.005 de octubre 4 de 2023 Reglamento de Becas y Descuentos”, ARTÍCULO CUARTO: DISPOSICIONES LEGALES.”\n\n\n\n• Se incluye el enunciado del literal n “No existe aplazamiento financiero sobre becas ni devoluciones sobre descuento, es decir”. En la primera viñeta de este literal, se adicionó al final “concepto de otros pagos diferentes a la matrícula (Capitulo 7 Reglamento Académico y estudiantil).”\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Agosto", "id": "5520", "codigo": "EDC-FT-002-UDES", "version": "12", "nombre": "PROPUESTA ECONÓMICA", "tipo": "Formatos", "proceso": "Educación Continua", "fecha": "24/08/2026", "cambios": "1. Se ajusta formula de ingresos 2. Se ajusta formula de descuentos otorgados \"3. Se eliminan los números de las celdas H62 y H 63 Se ajusta el control de cambios, según Procedimiento Control de Documentos y Registros.\""}, {"mes": "Agosto", "id": "5521", "codigo": "VAF-PR-001-UDES", "version": "16", "nombre": "PROCEDIMIENTO DE CONTROL DE LAS SALIDAS NO CONFORMES", "tipo": "Procedimientos", "proceso": "SGC VAF", "fecha": "27/08/2026", "cambios": "Cuando se relaciona en el documento “…La Coordinación de Calidad” se reemplaza por “el equipo CAF”.\n\nEn el numeral 4.2.8 Seguimiento al tratamiento de las SNC, se agregó\n• Caso 4: tipo de corrección, corrección\n• Caso 5: tipo de tratamiento, acción de contención\n• Caso 6: tipo de tratamiento, permiso de desviación\n• Caso 7: tipo de tratamiento, liberación\n• Caso 8: tipo de tratamiento, concesión\n\nEn el numeral 4.2.9 Cierre de la salida no conforme, se relaciona la figura 12, con respecto a los responsables de cierre de las SNC.\nSe ajusta tabla de contenido\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros"}, {"mes": "Septiembre", "id": "5592", "codigo": "COM-FT-004-UDES", "version": "1", "nombre": "FORMATO PARA CREACIÓN DE MICROSITIOS", "tipo": "Formatos", "proceso": "Gestión de Comunicaciones", "fecha": "25/09/2026", "cambios": "Se anexa línea para inclusión del nombre del micrositio. Se elimina tabla de estructura del micrositio. Se eliminan las tablas de artículos, eventos, galería, botones, listado de enlaces y desarrollo personalizado para que el solicitante describa en formato texto lo que requiere. Se elimina tabla de secciones para que el solicitante disponga en formato texto la información. Se agrega tabla nueva de noticias. Se agregan descripciones de cada punto. Se modifica descripción del apartado de contacto."}, {"mes": "Septiembre", "id": "5586", "codigo": "COM-MN-001-UDES", "version": "6", "nombre": "MANUAL DE MARCA UDES", "tipo": "Manuales", "proceso": "Gestión de Comunicaciones", "fecha": "18/09/2026", "cambios": "Se actualiza la estructura, numeración y organización de los apartados del Manual de Marca, con el propósito de mejorar la secuencia, coherencia y consulta de la información.\nSe eliminan los ítems 4.1.10 “Tamaño mínimo”, 4.1.12.1 “Versiones cromáticas – inscripción legal” y 4.1.13.1 “Uso sobre fondos – inscripción legal”.\nSe elimina el ítem 4.4 “Colores por facultades” como apartado independiente y su contenido se reorganiza dentro del numeral 4.1.6 “Guía de colores”, específicamente en el ítem 4.1.6.2 “Colores de las facultades”, con el fin de mantener una estructura temática ordenada y coherente.\nSe realizan ajustes de redacción, cohesión, coherencia y organización de contenidos en los apartados 4.1.1, 4.1.4, 4.1.5, 4.1.6, 4.1.7, 4.1.8, 4.1.9 y 4.1.12.\nSe incorporan nuevos subapartados para facilitar la comprensión y el desglose de la información, entre ellos los numerales 4.1.5.1, 4.1.6.1 y 4.1.12.1.\nSe actualizan y ajustan las imágenes y recursos gráficos del documento, incorporando comentarios para facilitar su revisión, mejorar su visualización y mantener coherencia con los lineamientos gráficos establecidos en el manual previamente aprobado.\nComo consecuencia de la reorganización de los contenidos, se actualiza la numeración de los apartados y subapartados posteriores, conservando la secuencia lógica del documento.\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Septiembre", "id": "5579", "codigo": "TAH-PC-003-UDES", "version": "3", "nombre": "PROTOCOLO DE ATENCIÓN AL PÚBLICO", "tipo": "Protocolos", "proceso": "Talento Humano", "fecha": "16/09/2026", "cambios": "Se incluye portada al documento\nSe agrega introducción al documento.\nSe agrega en Propósito la referencia al Manual de Comunicación en Crisis COM-MN-002-UDES.\nSe agregan las definiciones de cliente externo, cliente interno y protocolo.\nSe modifican todas las condiciones generales del documento.\nEn la revisión general, se modifica todo el numeral 5. Desarrollo de contenido.\nEn la revisión general, se modifica todo el numeral 6. Modalidades de atención.\nSe agrega el numeral 7. Malas prácticas que afectan la percepción del público respecto a la atención recibida.\nSe incluye numeral 8.1 Atención de PQRSF.\nSe modifica el código de vestuario e imagen institucional, agregando introducción, imágenes de referencia y recomendaciones para cada tipo de dotación.\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Septiembre", "id": "5566", "codigo": "VAF-PR-003-UDES", "version": "22", "nombre": "PROCEDIMIENTO DE ACCIONES CORRECTIVAS PREVENTIVAS Y DE MEJORA  (Solo para los de la vaf)", "tipo": "Procedimientos", "proceso": "SGC VAF", "fecha": "14/09/2026", "cambios": "Se ajustó el título 4.3.3 \"Redacción de Oportunidades de mejora\" a \"Redacción de Hallazgos\".\n\nEn el numeral 4.3.3 Redacción de hallazgos, se ajustó la imagen de sugerencias, se cambió \"de la oportunidad de mejora\" a \"del hallazgo\".\n\nEn el numeral 4.3.4.1 Aspectos generales a tener en cuenta en la aplicación de las acciones correctivas, preventivas y de mejora. Se agregó el ítem e: \"Para los hallazgos derivados de auditorías externas, el seguimiento al cumplimiento y avance de los planes de acción deberá realizarse de acuerdo con las responsabilidades establecidas en la Tabla 2. Responsables de las etapas de aplicación de la gestión de no conformidades u oportunidades de mejora en el SGC-VAF\".\n\nEn el numeral 4.5.1.1. Sistema de Gestión de Calidad VAF y Centro de Conciliación, en: Seleccionar la causa raíz se eliminó: \"enviando correo electrónico al responsable\" y se agregó: \"por correo electrónico a la Representante de la Dirección.\"\n\nEn el numeral 4.5.4.1. Evidencias en la tabla del ejemplo, se agrega que los registros fotográficos deben contar con: \"con información de fecha y hora\".\n\nEn el numeral 4.5.6. Evaluación del plan de acción, se ajustó \"oportunidad de mejora\" por \"hallazgo\".\n\nEn el numeral 4.5.7. Cierre de la no conformidad y consolidación, se ajusta: \"oportunidades de mejora abierta\" a \"acciones de mejora abiertas\"\n\nEn el numeral 4.6. INFORME DE ESTADO DE LAS ACCIONES CORRECTIVAS, PREVENTIVAS Y DE MEJORA se ajustó: \"las oportunidades de mejora\" por \"los hallazgos\"\n\nEn el numeral 4.5.7. Cierre de la no conformidad y consolidación, se agregó el párrafo 5 correspondiente a conforme a lo establecido en el VAF-PR-007-UDES, incorporó el uso de la sigla (C.E.) para las oportunidades de los planes de acción cerrados eficazmente.\n\nEn el numeral 7. DEFINICIONES, se ajustaron las definiciones conforme a la actualización de la norma ISO 9000:2026, de \"Acción correctiva\", \"Acción preventiva\", \"Conformidad\", \"Corrección\" y \"No conformidad\".\n\nSe ajustó la tabla de contenido y la tabla de figuras."}, {"mes": "Septiembre", "id": "5563", "codigo": "BII-GU-001-UDES", "version": "1", "nombre": "GUÍA PARA LA SOLICITUD Y USO DE LA TRITURADORA", "tipo": "Guía", "proceso": "Bienestar Institucional", "fecha": "11/09/2026", "cambios": "OPERACIÓN 6.3\n• Se agregó: Retirar el forro protector: Antes de encender la máquina, retire el forro protector que cubre el equipo. Dóblelo y colóquelo en un lugar limpio, seco y alejado del área de trabajo (puede dejarlo sobre una superficie elevada o colgado, pero nunca en el piso donde pueda ensuciarse o mojarse). Asegúrese de que el equipo quede completamente descubierto para evitar que el forro entre en contacto con partes móviles o restrinja la ventilación del motor durante la operación.\n• Se aplicó Negrita al Título Figura 5 . Botón de apagado\n• Se agregó: Colocar el forro protector contra intemperie: Una vez limpia y apagada la máquina, coloque el forro protector que cubre totalmente el equipo (ver imagen adjunta). Asegúrese de que quede bien ajustado y cubra toda la estructura, (Ver Figura 6). Este forro debe permanecer puesto siempre que la trituradora no esté en uso, para protegerla del polvo, la humedad y la intemperie.\n• Se agregó: Figura 6. Forro Protector.\n• Se agregó\n8. RECOMENDACIONES\n\n• No se recomienda triturar alimentos con alto contenido de humedad (residuos de cafetería frescos o húmedos). La humedad acelera el desgaste de las cuchillas, puede obstruir el sistema y afectar el motor.\n\n• El equipo está diseñado para productos secos (forrajes, granos, etc.). Si el material está húmedo, se sugiere secarlo previamente o separar los residuos con menor humedad."}, {"mes": "Septiembre", "id": "5571", "codigo": "GED-GU-001-UDES", "version": "9", "nombre": "USO ADECUADO DEL PAPEL", "tipo": "Guía", "proceso": "Gestión Documental", "fecha": "11/09/2026", "cambios": "3. CONDICIONES GENERALES\n• Se complementa Ley 594 de 2000\n• Se cambia el término “decreto” por “Directiva”\n\n4.1.2 SOLICITUD DE SERVICIOS O PRODUCTOS\n• Se actualizan las imágenes\n• Se actualiza link proveedores compras\n• Se elimina link acceso a Midasoft\n\n4.2.2 Reducir la cantidad de impresiones o fotocopias\n• Se modifica la trazabilidad para el formato de actas y se anexa la trazabilidad que corresponde para los campus.\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Septiembre", "id": "5560", "codigo": "VAF-FT-032-UDES", "version": "4", "nombre": "INFORME DE GESTIÓN  (solo para los de la VAF)", "tipo": "Formatos", "proceso": "SGC VAF", "fecha": "10/09/2026", "cambios": "En el numeral 3 se ajustó las descripciones de las escalas de cumplimiento En el numeral 10 se ajustó la descripción. Se ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Septiembre", "id": "5570", "codigo": "VAF-PG-002-UDES", "version": "17", "nombre": "PROGRAMA DE AUDITORÍAS  (SOLO PARA LOS DE LA VAF)", "tipo": "Programas", "proceso": "SGC VAF", "fecha": "10/09/2026", "cambios": "Numeral 4.\nSe complementa el literal b: â€œy tecnologías que permitan desarrollar auditorías remotas para la observación, entrevistas y verificación de evidencias objetivasâ€.\nEn el literal j se incluye â€œel líder del proceso/subprocesoâ€ posterior a la frase â€œcuando por alguna razón justificadaâ€ y se elimina la expresión â€œno pueda realizarse la auditoría interna en la fecha y hora indicada, el responsable del proceso y/o subproceso a auditarâ€\nNumeral 5.1\nSe ajusta el nombre de la Facultad de Ciencias Sociales, eliminando â€œpolíticas y humanidadesâ€.\nNumeral 5.2.1.\nSe ajusta la trazabilidad de la norma conforme a su actualización, pasando de ISO 19011: 2018 a ISO 19011:2026, el numeral relacionado, corrigiendo del 7 al 7.2 y su nombre completo.\nNumeral 5.2.2.\nSe incluye el tercer párrafo â€œSi la auditoría se desarrolla de manera remota, es necesario que se incluya en las competencias del auditor:\n\nâ€¢ Habilidades técnicas para usar las tecnologías apropiadas durante la auditoría.\n\nâ€¢ Conocimientos y habilidades para realizar eficazmente la auditoría de manera remotaâ€.\n\nNumeral 5.3.3.\nSe incluye â€œmediante correo electrónicoâ€ al finalizar la nota del numeral.\nSe elimina el subtítulo â€œpasos para el registro del plan de auditoría en sistema.\nNumeral 5.3.4.\nEn la primera viñeta se incluye â€œy luego al módulo de auditoríasâ€ al finalizar la oración.\n\nNumeral 5.3.7.\nSe elimina el subtítulo â€œpasos para la creación de listas de verificaciónâ€.\n\nNumeral 5.3.8.\nSe incluye el siguiente párrafo, previo al numeral 5.3.8.1: â€œLa auditoría se podrá realizar en modalidad presencial o remota. Al usar métodos de auditoría remota, es responsabilidad conjunta del auditado y de los auditores asegurar que la auditoría se realice eficazmente y que se logren los objetivos de la auditoría. A continuación, se explica cada una de las etapas a considerar para la ejecución eficaz de la auditoría internaâ€.\n\nNumeral 5.3.8.1.\nAl inicio de este numeral se incluye: â€œEsta reunión se ejecuta con el propósito de:\na. Confirmar el acuerdo de todos los participantes sobre el plan de auditoría;\nb. Presentar al equipo auditor y sus roles;\nc. Asegurarse de que se pueden realizar todas las actividades de auditoría planificadasâ€.\n\nAsimismo, en el literal 3 se agrega â€œy criteriosâ€, y se incluyen los literales del 6 al 11, relacionados con los puntos que debe incluir en auditor en la reunión de apertura.\nNumeral 5.3.8.\nSe incluye en el segundo párrafo â€œpero sin limitarseâ€ y la palabra â€œdocumentosâ€ se cambia por â€œinformación documentadaâ€.\n\nNumeral 5.3.8.3.\nSe agrega â€œpresidida por el líder del equipo auditorâ€, en el párrafo inicial.\n\nEn la primera viñeta se reemplaza â€œleer el número deâ€ por â€œpresentar losâ€. Y se incluye al final â€œde tal manera que se comprendan y se reconozcan por el auditadoâ€.\n\nSe incluyen las últimas tres viñetas del numeral.\nNumeral 5.3.8.4.\nSe incluye todo el numeral.\n\nNumeral 5.4.\nSe debe ingresar al sistema de información del SGC-VAF y seguir la siguiente ruta para la generación del informe de auditorías internas.\n\nNumeral 5.4.2.2.\nSe elimina este numeral dado que la información ya se encuentra relacionada en el numeral 5.5. Notificación de resultados de auditoría interna.\n\nSe incluye al final del párrafo: â€œen caso que no se reciban solicitudes de aclaración se da por aceptado los hallazgos por el auditado y se realiza el cierre de la auditoría en el sistema de información del SGC-VAFâ€.\n\nNumeral 5.4.2.3\nSe adiciona al final del párrafo â€œcomo se describe a continuaciónâ€.\n\nNumerales 2, 5.4.2.2 y 5.5.\nSe actualiza el nombre de la Facultad de Ciencias Sociales.\n\nNumeral 6.\nSe incluyen las definiciones de: alcance de la auditoría, desempeño, eficacia, evidencia objetiva, método de auditoría remota y requisito. Asimismo, se complementan las definiciones de: criterios de auditoría, hallazgos de la auditoría y observador, actualizados conforme a la ISO 19011:2026.\n\nDe igual forma, se actualizaron las referencias de numeral y norma de referencia de los conceptos.\n\nAnexos.\nSe actualiza imagen del formato VAF-FT-006-UDES"}, {"mes": "Septiembre", "id": "5569", "codigo": "VAF-PC-001-UDES", "version": "10", "nombre": "APLICACION DE LA MARCA DE CONFORMIDAD DE LA CERTIFICACION ICONTEC  (SOLO PARA LOS DE LA VAF)", "tipo": "Protocolos", "proceso": "SGC VAF", "fecha": "10/09/2026", "cambios": "Numeral 2. Se adiciona aclaración de aplicabilidad del documento para el Centro de Conciliación, \"del campus Bucaramanga\".\n\nNumeral 3. se cambian los literales numéricos por alfabéticos. En el literal h. se ajusta trazabilidad del manual de uso de la marca de certificación ICONTE, pasando de E-GM-001 versión 05 a E-GM-0001 versión 8).\n\nSe ajustan entradas del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Septiembre", "id": "5486", "codigo": "GEC-GU-001-UDES", "version": "0", "nombre": "GUÍA ORIENTADORA PARA EL DISEÑO Y REDISEÑO CURRICULAR DE PROGRAMA ACADÉMICOS", "tipo": "Guía", "proceso": "Gestión Curricular", "fecha": "01/09/2026", "cambios": "Creación"}, {"mes": "Octubre", "id": "5586", "codigo": "COM-MN-001-UDES", "version": "6", "nombre": "MANUAL DE MARCA UDES", "tipo": "Manuales", "proceso": "Gestión de Comunicaciones", "fecha": "18/09/2026", "cambios": "Se actualiza la estructura, numeración y organización de los apartados del Manual de Marca, con el propósito de mejorar la secuencia, coherencia y consulta de la información.\nSe eliminan los ítems 4.1.10 “Tamaño mínimo”, 4.1.12.1 “Versiones cromáticas – inscripción legal” y 4.1.13.1 “Uso sobre fondos – inscripción legal”.\nSe elimina el ítem 4.4 “Colores por facultades” como apartado independiente y su contenido se reorganiza dentro del numeral 4.1.6 “Guía de colores”, específicamente en el ítem 4.1.6.2 “Colores de las facultades”, con el fin de mantener una estructura temática ordenada y coherente.\nSe realizan ajustes de redacción, cohesión, coherencia y organización de contenidos en los apartados 4.1.1, 4.1.4, 4.1.5, 4.1.6, 4.1.7, 4.1.8, 4.1.9 y 4.1.12.\nSe incorporan nuevos subapartados para facilitar la comprensión y el desglose de la información, entre ellos los numerales 4.1.5.1, 4.1.6.1 y 4.1.12.1.\nSe actualizan y ajustan las imágenes y recursos gráficos del documento, incorporando comentarios para facilitar su revisión, mejorar su visualización y mantener coherencia con los lineamientos gráficos establecidos en el manual previamente aprobado.\nComo consecuencia de la reorganización de los contenidos, se actualiza la numeración de los apartados y subapartados posteriores, conservando la secuencia lógica del documento.\nSe ajustan entradas y presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5579", "codigo": "TAH-PC-003-UDES", "version": "3", "nombre": "PROTOCOLO DE ATENCIÓN AL PÚBLICO", "tipo": "Protocolos", "proceso": "Talento Humano", "fecha": "16/09/2026", "cambios": "Se incluye portada al documento\nSe agrega introducción al documento.\nSe agrega en Propósito la referencia al Manual de Comunicación en Crisis COM-MN-002-UDES.\nSe agregan las definiciones de cliente externo, cliente interno y protocolo.\nSe modifican todas las condiciones generales del documento.\nEn la revisión general, se modifica todo el numeral 5. Desarrollo de contenido.\nEn la revisión general, se modifica todo el numeral 6. Modalidades de atención.\nSe agrega el numeral 7. Malas prácticas que afectan la percepción del público respecto a la atención recibida.\nSe incluye numeral 8.1 Atención de PQRSF.\nSe modifica el código de vestuario e imagen institucional, agregando introducción, imágenes de referencia y recomendaciones para cada tipo de dotación.\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5563", "codigo": "BII-GU-001-UDES", "version": "1", "nombre": "GUÍA PARA LA SOLICITUD Y USO DE LA TRITURADORA", "tipo": "Guía", "proceso": "Bienestar Institucional", "fecha": "11/09/2026", "cambios": "OPERACIÓN 6.3\n• Se agregó: Retirar el forro protector: Antes de encender la máquina, retire el forro protector que cubre el equipo. Dóblelo y colóquelo en un lugar limpio, seco y alejado del área de trabajo (puede dejarlo sobre una superficie elevada o colgado, pero nunca en el piso donde pueda ensuciarse o mojarse). Asegúrese de que el equipo quede completamente descubierto para evitar que el forro entre en contacto con partes móviles o restrinja la ventilación del motor durante la operación.\n• Se aplicó Negrita al Título Figura 5 . Botón de apagado\n• Se agregó: Colocar el forro protector contra intemperie: Una vez limpia y apagada la máquina, coloque el forro protector que cubre totalmente el equipo (ver imagen adjunta). Asegúrese de que quede bien ajustado y cubra toda la estructura, (Ver Figura 6). Este forro debe permanecer puesto siempre que la trituradora no esté en uso, para protegerla del polvo, la humedad y la intemperie.\n• Se agregó: Figura 6. Forro Protector.\n• Se agregó\n8. RECOMENDACIONES\n\n• No se recomienda triturar alimentos con alto contenido de humedad (residuos de cafetería frescos o húmedos). La humedad acelera el desgaste de las cuchillas, puede obstruir el sistema y afectar el motor.\n\n• El equipo está diseñado para productos secos (forrajes, granos, etc.). Si el material está húmedo, se sugiere secarlo previamente o separar los residuos con menor humedad."}, {"mes": "Octubre", "id": "5571", "codigo": "GED-GU-001-UDES", "version": "9", "nombre": "USO ADECUADO DEL PAPEL", "tipo": "Guía", "proceso": "Gestión Documental", "fecha": "11/09/2026", "cambios": "3. CONDICIONES GENERALES\n• Se complementa Ley 594 de 2000\n• Se cambia el término “decreto” por “Directiva”\n\n4.1.2 SOLICITUD DE SERVICIOS O PRODUCTOS\n• Se actualizan las imágenes\n• Se actualiza link proveedores compras\n• Se elimina link acceso a Midasoft\n\n4.2.2 Reducir la cantidad de impresiones o fotocopias\n• Se modifica la trazabilidad para el formato de actas y se anexa la trazabilidad que corresponde para los campus.\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5630", "codigo": "RCA-FT-007-UDES", "version": "5", "nombre": "AUTORIZACIÓN DE ENTREGA DE DOCUMENTOS Y/O COPIAS A TERCEROS", "tipo": "Formatos", "proceso": "Registro y Control Académico", "fecha": "26/10/2026", "cambios": "Se adiciona en el primer párrafo la expresión “para que la entrega de copias físicas o enviar por correo electrónico en mi nombre”, con el fin de precisar la autorización para la entrega de los documentos. Se elimina “PROGRAMA DE PREGRADO” y se reemplaza por “DOCUMENTOS” en el encabezado de la tabla. Se elimina la palabra “BACHILLER” de “ACTA DE GRADO” y “DIPLOMA DE BACHILLER”, dejando las denominaciones “ACTA DE GRADO” y “DIPLOMA”, respectivamente. Se adiciona la opción “ICFES” en la sección de documentos. Se ajustan las entradas correspondientes al control de cambios, de acuerdo con lo establecido en el Procedimiento de Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5636", "codigo": "TAH-FT-001-UDES", "version": "8", "nombre": "SOLICITUD DE PERSONAL", "tipo": "Formatos", "proceso": "Talento Humano", "fecha": "26/10/2026", "cambios": "Tipo de solicitud: se incluye opción de Actualización perfil del cargo. Se aclara información orientadora del campo de Formación Exigible, respecto a los cursos, capacitaciones certificados que aplican para el cargo, indicando impacto del requisito en la continuidad del candidato en el proceso de selección. Se incluye campo de Formación Deseable, con aclaración de los aspectos que se consideran aplicables y criterios de valoración de esta formación en procesos de selección. IV Experiencia requerida: se incluyen excepciones: (cuando el cargo puede ser ejercido por una persona sin experiencia, seleccione la opción Ninguna. Si se requiere un mínimo de experiencia, se acepta para recién ingreso y aprendices la pasantía o la etapa productiva, relacionada con el cargo y acorde con los estudios) 1 a 6 meses, V. Responsabilidades Se incluye NOTA respecto a responsabilidades que aplican para todos los cargos y específicas del SGC-VAF para trabajadores que integran equipos de trabajo que hacen parte, indicando que estas se definen en el Manual de Funciones y Responsabilidades. En el campo Autorización Vicerrectoría Administrativa y Financiera: se incluye alcance de la autorización (aplica para creación de cargo nuevo). Se ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5653", "codigo": "EDC-GU-001-UDES", "version": "1", "nombre": "GUÍA PARA EL DISEÑO Y EJECUCIÓN DE EVENTOS", "tipo": "Guía", "proceso": "Educación Continua", "fecha": "27/10/2026", "cambios": "Se incluyen nuevas definiciones\n\nSe ajusta la redacción del párrafo del ítem 3.3\n\nSe ajusta intensidad horaria del ítem 3.3.2 Tipología de eventos\n\nSe elimina el paso Actualización del histórico del ítem PASOS PARA LA ORGANIZACIÓN Y EJECUCIÓN DEL EVENTO, debido a que ese formato ya no se utiliza. Esta labor se hace desde Educación Continua.\n\nSe ajusta formato propuesta académica\n\nSe ajusta formato propuesta económica\n\nSe elimina formato carta de presentación de la propuesta\n\nSe elimina formato registro de histórico\n\nSe ajusta formato reporte de evento ejecutado\n\nSe ajusta presentación del control de cambios, según Procedimiento Control de Documentos y Registros."}, {"mes": "Octubre", "id": "5639", "codigo": "CRC-GU-004-UDES", "version": "5", "nombre": "SOLICITUD Y RENOVACIÓN CRÉDITO ICETEX", "tipo": "Guía", "proceso": "Crédito y Cartera", "fecha": "27/10/2026", "cambios": "Se realiza revisión general de signos de puntuación y ortografía sobre todo el documento y se hacen las modificaciones necesarias.\n\nEn el punto 2 en el alcance se agrega extensiones.\n\nEn el punto 3 en el primer ítem se agrega “del estudiante”.\n\nEn el punto 3 en el cuarto ítem se agrega “solo”.\n\nEn el punto 3 en el sexto ítem se agrega “créditos” y “en”.\n\nEn el punto 4.1 se agregan las palabras “a” y “de”.\n\nEn el punto 4.1.1 se agrega las palabras “consultar” y “créditos” y se agrega la palabra paso al ítem 5 hasta el 10. Y en el paso 7 se agrega las palabras “periodo académico”.\n\nEn el punto 4.1.2 se agrega la palabra “presenta estado de” y “enviará”.\n\nEn el punto 4.1.3 se agrega la frase “la legalización” y “a verificar”.\n\nEn el punto 4.1.3 en el paso 3 se modifica la observación y en el paso 4 tambien se realizan modificaciones de gramática.\n\nAl finalizar el punto 4 se modifica la idea central de las observaciones.\n\nEn el punto 5 el numeral 2, se agrega la frase: “Se solicita al estudiante por correo electrónico, el” y en el numeral 3 se agrega la palabra “pagaré”\n\nEn el punto 6.2 se agrega el título “Legalización de pagos realizados por matrícula, derechos pecuniarios, otros servicios y abonos a cartera CRC-IN-008-UDES verificación de documentos en el aplicativo ICETEX” y en el paso 5, Verificar la documentación se agrega extensiones.\n\nEn el punto 6.2 paso 3 se agrega la frase: “Aquí se responde al estudiante sobre el trámite solicitado: asignar el estado y, en ‘Enviar Notificación’, la opción SÍ”\n\nEn el punto 6.3 se hacen modificaciones de redacción.\n\nEn el punt
